<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="timer.css">
</head>
<body>

    <div class="stopwatch-container">
        <div class="stopwatch-wrapper">

            <h1 id="timer">00:00:00:00</h1>

            <div class="buttons">
                <button id="startBtn" class="start" onclick="startTimer()">Start</button>
                <button id="pauseBtn" class="pause" onclick="pauseTimer()">Pause</button>
                <button id="resetBtn" class="reset" onclick="resetTimer()">Reset</button>
                <button id="lapBtn" class="lap-btn" onclick="lapTimer()">Lap</button>
            </div>

            <div class="lap">
                <ul id="laps"></ul>
            </div>

        </div>
    </div>

    <script src="timer.js"></script>
</body>
</html>
